<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>App Hub — Prundaru</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-hi: #1c2430;
    --line: #262d38; --text: #e6edf3; --muted: #8b949e;
    --accent: #3fb950; --accent-ink: #0d1117; --link: #58a6ff; --bad: #f85149;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --panel-hi: #f0f3f6;
      --line: #d8dee4; --text: #1f2328; --muted: #656d76;
      --accent: #1f883d; --accent-ink: #ffffff; --link: #0969da; --bad: #cf222e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 22px 0 24px; }
  input[type=search] {
    flex: 1 1 240px; min-width: 200px; padding: 9px 13px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  input[type=search]:focus { outline: 2px solid var(--link); outline-offset: -1px; }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: flex; gap: 14px; align-items: flex-start;
  }
  .card:hover { background: var(--panel-hi); }
  .icon {
    width: 60px; height: 60px; border-radius: 14px; flex: none; object-fit: cover;
    background: var(--panel-hi); border: 1px solid var(--line);
  }
  .icon.ph { display: grid; place-items: center; color: var(--muted); font-size: 22px; font-weight: 600; }
  .body { min-width: 0; flex: 1; }
  .name { font-weight: 600; font-size: 16px; margin: 0 0 2px; }
  .pkg { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .desc {
    color: var(--muted); font-size: 13px; margin: 8px 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .tag.production { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .tag.internal, .tag.alpha, .tag.beta { color: var(--link); border-color: color-mix(in srgb, var(--link) 45%, transparent); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  a.btn, button.btn {
    font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 7px;
    text-decoration: none; border: 1px solid var(--line); color: var(--text); background: transparent;
  }
  a.btn:hover, button.btn:hover { background: var(--panel-hi); border-color: var(--muted); }
  a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  a.btn.primary:hover { filter: brightness(1.08); }
  button.btn { font-family: inherit; cursor: pointer; }
  .btn.off { opacity: .45; pointer-events: none; }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
  footer.stale {
    color: var(--bad); font-weight: 600; border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent);
    border-radius: 8px; padding: 10px 12px;
  }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>App Hub</h1>
    <p class="sub">Every app in the Play developer account, with its test-track link. Synced from the Google Play Developer API.</p>
  </header>

  <div class="bar">
    <input type="search" id="q" placeholder="Filter apps…" autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

<script>
const grid = document.getElementById('grid');
const foot = document.getElementById('foot');
const countEl = document.getElementById('count');
const q = document.getElementById('q');

let apps = [];
let links = {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function card(a) {
  // data-letter carries the placeholder glyph so a broken <img> can degrade to
  // the same initial the no-icon case already shows (see the error listener below).
  const letter = esc((a.title || '?')[0].toUpperCase());
  const icon = a.icon
    ? `<img class="icon" src="${esc(a.icon)}" alt="" loading="lazy" data-letter="${letter}">`
    : `<div class="icon ph">${letter}</div>`;
  const tags = [
    `<span class="tag ${esc(a.statusKind)}">${esc(a.status)}</span>`,
    a.version ? `<span class="tag">v${esc(a.version)}</span>` : ''
  ].join('');

  // links.json wins over apps.json, so a pasted link shows up on the next Pages
  // build instead of waiting for the 6-hourly Play sync to fold it in.
  const url = links[a.package] || a.testUrl || '';
  const test = url
    ? `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Join internal test</a>` +
      `<button type="button" class="btn copy" data-url="${esc(url)}" title="Copy the test link">Copy link</button>`
    : `<span class="btn off">Test link not set</span>`;

  // Only live-on-Play apps get a store link. For anything still in testing the
  // store page is useless to a tester (or misleading), so the opt-in link is the
  // only way in.
  const store = a.statusKind === 'production'
    ? `<a class="btn" href="${esc(a.storeUrl)}" target="_blank" rel="noopener">Play Store</a>`
    : '';

  return `<div class="card">
    ${icon}
    <div class="body">
      <p class="name">${esc(a.title)}</p>
      <span class="pkg">${esc(a.package)}</span>
      ${a.shortDescription ? `<p class="desc">${esc(a.shortDescription)}</p>` : ''}
      <div class="tags">${tags}</div>
      <div class="actions">
        ${test}
        ${store}
      </div>
    </div>
  </div>`;
}

function render() {
  const needle = q.value.trim().toLowerCase();
  const shown = apps.filter(a =>
    !needle || (a.title + ' ' + a.package + ' ' + (a.shortDescription || '')).toLowerCase().includes(needle));
  grid.innerHTML = shown.map(card).join('') || `<p class="sub">No apps match “${esc(q.value)}”.</p>`;
  countEl.textContent = `${shown.length} of ${apps.length} apps`;
}

Promise.all([
  fetch('apps.json?t=' + Date.now()).then(r => r.json()),
  fetch('links.json?t=' + Date.now()).then(r => r.json()).catch(() => ({})),
]).then(([appData, linkData]) => {
  apps = appData.apps || [];
  links = Object.fromEntries(
    Object.entries(linkData).filter(([k, v]) => !k.startsWith('_') && typeof v === 'string' && v));
  render();
  showSynced(appData.generated);
}).catch(e => {
  grid.innerHTML = `<p class="err">Could not load app data — ${esc(e.message)}</p>`;
});

// The sync Action runs every 6h. If the page is showing data much older than
// that the Action is failing silently — say so instead of serving stale data
// under a timestamp nobody parses.
const STALE_AFTER_MS = 24 * 60 * 60 * 1000;

function showSynced(generated, now = Date.now()) {
  const when = new Date(generated);
  const bad = isNaN(when);
  const age = bad ? Infinity : now - when.getTime();
  const stamp = bad ? String(generated) : when.toLocaleString();
  foot.classList.toggle('stale', age > STALE_AFTER_MS);
  foot.textContent = age > STALE_AFTER_MS
    ? `⚠ App data looks stale — last synced from Play ${stamp}. The 6-hourly sync may be failing; check the Sync Play apps workflow.`
    : 'Last synced from Play ' + stamp;
  return age > STALE_AFTER_MS;
}

// Sharing a test build means handing someone the opt-in URL, so make that one click.
// navigator.clipboard is unavailable on insecure origins and can be denied by
// permission, so keep the old execCommand route as a fallback.
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function flash(btn, label) {
  btn.textContent = label;
  setTimeout(() => { btn.textContent = 'Copy link'; }, 1600);
}

// A cached-but-since-deleted icon, or one that 404s from Pages, would otherwise
// leave a broken-image glyph in the card. sync.py already writes icon:null when a
// download fails, so this is the runtime half of the same guard. `error` does not
// bubble, hence the capture-phase listener.
grid.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains('icon')) return;
  const ph = document.createElement('div');
  ph.className = 'icon ph';
  ph.textContent = img.dataset.letter || '?';
  img.replaceWith(ph);
}, true);

grid.addEventListener('click', e => {
  const btn = e.target.closest('button.copy');
  if (!btn) return;
  const url = btn.dataset.url;
  const fallback = () => flash(btn, legacyCopy(url) ? 'Copied' : 'Copy failed');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => flash(btn, 'Copied'), fallback);
  } else {
    fallback();
  }
});

q.addEventListener('input', render);
</script>
</body>
</html>
